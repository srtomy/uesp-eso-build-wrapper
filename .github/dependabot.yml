version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # typescript 6 conflicts with @typescript-eslint's peer range — re-enable
    # once typescript-eslint publishes support for TS 6.
    ignore:
      - dependency-name: typescript
        versions: [">=6"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
