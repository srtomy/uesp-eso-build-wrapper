name: PR title

on:
  pull_request:
    # synchronize: required checks must re-run on every new head commit,
    # otherwise branch protection blocks the PR forever.
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title (Conventional Commits)
        # amannn/action-semantic-pull-request@v6.1.1 — pinned to commit SHA
        # (third-party actions must not float on mutable tags: SonarCloud S7637)
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            perf
            test
            build
          # Exempt automated Release PRs (release-please, phase 2).
          ignoreLabels: |
            github-release
