name: PR title

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            perf
            test
            build
          # Exempt automated Release PRs (release-please, phase 2).
          ignoreLabels: |
            github-release
