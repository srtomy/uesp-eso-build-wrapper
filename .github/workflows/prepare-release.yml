name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.4.0 or 0.4.0) — use auto to bump from Conventional Commits'
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare release (bump + CHANGELOG)
        id: prepare
        run: node scripts/prepare-release.mjs ${{ inputs.version }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/v${{ steps.prepare.outputs.version }}
          title: 'chore: release v${{ steps.prepare.outputs.version }}'
          commit-message: 'chore: release v${{ steps.prepare.outputs.version }}'
          labels: prepare-release
          body: |
            Bump version + CHANGELOG for **v${{ steps.prepare.outputs.version }}** (bump: `${{ steps.prepare.outputs.bump }}`, base: `${{ steps.prepare.outputs.last_tag || 'none' }}`).

            - Generated by `scripts/prepare-release.mjs` (B+ filtered: feat/fix/perf → changelog, chore/ci/test/docs omitted unless `[release-note]`).
            - Optional polish: run the `changelog-polish` agent locally (opencode) to rewrite entries in user-facing language, then push an extra commit to this branch.
            - CI merge-gate still required before merging.
          draft: false
