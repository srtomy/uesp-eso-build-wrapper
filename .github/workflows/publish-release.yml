name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.4.0). Leave empty to use version from package.json on ref.'
        required: false
        default: ''
        type: string
      ref:
        description: 'Git ref to release from (branch, tag or SHA). Default: main'
        required: false
        default: 'main'
        type: string
      npm_tag:
        description: 'npm dist-tag for the publish (latest, rc, canary…). Pre-releases MUST use something other than latest.'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Tag + GitHub Release + npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
            VER="${RAW#v}"
            # Reject malformed versions early ("auto" is a Prepare-only value).
            if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Invalid version '$RAW' — expected vX.Y.Z or X.Y.Z[-prerelease]. Leave the input empty to use package.json."
              exit 1
            fi
          else
            VER=$(node -p "require('./package.json').version")
          fi
          # The tag must point at a commit whose package.json matches the released
          # version, otherwise npm would publish a different version than the tag.
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$VER" != "$PKG_VER" ]; then
            echo "::error::package.json version ($PKG_VER) does not match the release version ($VER). Merge the Prepare release PR first, or pass the matching version."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER (tag: v$VER)"

      - name: Verify CHANGELOG
        run: |
          if ! grep -q "## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for v${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "CHANGELOG entry found."

      - name: Verify tag does not exist
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi
          # Also check remote
          if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q "${{ steps.version.outputs.tag }}"; then
            echo "::error::Remote tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Extract release notes
        run: |
          VER="${{ steps.version.outputs.version }}"
          # Extract section for this version (between ## [VER] and next ## [)
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          echo "--- Release notes ---"
          cat /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::Empty release notes"
            exit 1
          fi

      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          # `0.8.0-rc.1` → pre-release; a pre-release never becomes "Latest".
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: |
          TAG="${{ inputs.npm_tag }}"
          if [ -z "$TAG" ]; then TAG=latest; fi
          # Never let a pre-release version hijack the `latest` dist-tag.
          case "${{ steps.version.outputs.version }}" in
            *-*) if [ "$TAG" = "latest" ]; then
                   echo "::error::Pre-release version requires a non-latest npm_tag (e.g. rc, canary)"
                   exit 1
                 fi ;;
          esac
          echo "Publishing ${{ steps.version.outputs.version }} with dist-tag: $TAG"
          npm publish --tag "$TAG" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish hint
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: |
          echo "NPM_PUBLISH_ENABLED != 'true' — skipping npm publish."
          echo "To enable, set repository variable NPM_PUBLISH_ENABLED=true and add secret NPM_TOKEN."
          echo "Then re-run this workflow or publish manually: npm publish --provenance --access public"

  # Deploy the docs site only on release, so it reflects the npm version (not main).
  # `predocs:build` regenerates the API (typedoc) from the release ref's package.json.
  # A tag push cannot trigger this: the tag is pushed with GITHUB_TOKEN, which creates
  # no new workflow runs — so the deploy lives here, in the same workflow as the publish.
  # Requires Pages served by "GitHub Actions" (Settings → Pages).
  deploy-docs:
    name: deploy-docs
    needs: publish
    # Never rebuild the public docs from a pre-release (canary/rc) ref.
    if: ${{ !contains(needs.publish.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build docs site
        run: npm run docs:build
        env:
          DOCS_VERSION: ${{ needs.publish.outputs.tag }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
