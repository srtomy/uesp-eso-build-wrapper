name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Gate PRs into both integration targets (develop → main chain).
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Latest Node LTS only (Krypton). Node 20 reached EOL 2026-04;
        # re-add lines to `engines`/this matrix together.
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        if: matrix.node-version != '24.x'
        run: npm test

      - name: Test with coverage
        if: matrix.node-version == '24.x'
        run: npm run test:coverage

      - name: Coverage summary
        if: matrix.node-version == '24.x'
        run: node scripts/coverage-summary.mjs

      - name: Upload coverage report
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error
          retention-days: 14

      # Upload lcov to Codecov (badge/PR comments). Non-blocking: Sonar is the
      # coverage merge gate; a transient Codecov outage must not fail CI.
      - name: Upload coverage to Codecov
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # dist/ is committed; fail if the working tree does not match the source.
      - name: Check dist/ is up to date
        run: git diff --exit-code dist

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Local lockfile-pinned binaries via npm scripts: no on-demand install and
      # no lifecycle scripts (SonarCloud S6505/S8543).
      - name: publint (package.json vs dist)
        run: npm run publint

      - name: attw (type declarations)
        # The package is ESM-only (exports["."] → { types, default }). attw's
        # node16-from-CJS leg is ignored via the npm script (cjs-resolves-to-esm):
        # attw models Node 16 semantics, but engines >= 24 resolves require(esm).
        # See docs/CI-PIPELINE.md §5.
        run: npm run attw

      - name: ESM smoke test (pack + import + require(esm) + calculateBuild)
        # Packs the tarball, installs into a clean project and imports the
        # package via `import` (ESM) and `require` from CJS (require(esm)),
        # initializing the engine from the vendored game data and computing
        # a golden build.
        run: npm run test:esm

      - name: npm publish dry run (files allowlist)
        run: npm publish --dry-run

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: npm audit
        run: npm audit --audit-level=high

  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Fails on dead links, broken locale pages and config errors.
      - name: Build docs site
        run: npm run docs:build

  # Deploys the docs site to GitHub Pages. Runs only for pushes to main;
  # PRs are validated by docs-build above.
  # Requires Pages to be served from "GitHub Actions" (Settings → Pages).
  deploy-docs:
    name: deploy-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test, build, docs-build]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build docs site
        run: npm run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
