# SonarCloud analysis configuration (honored by the CI-based scan in
# .github/workflows/sonar.yml; vendored UESP code and committed build output
# are third-party / generated and must not affect quality ratings).
sonar.projectKey=srtomy_uesp-eso-build-wrapper
sonar.organization=srtomy
sonar.exclusions=vendor/**/*,dist/**/*
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
# Dev-only tooling: analyzed but outside the coverage denominator (lcov covers src/ only).
sonar.coverage.exclusions=scripts/**/*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
